<?xml version="1.0" encoding="UTF-8"?>
<!--
  플레이스홀더 앱 아이콘 (보행안전 WSS) — 1024x1024 시안
  App Store 는 1024x1024 PNG(알파/투명도 없음)를 요구합니다.
  - 배경은 모서리 반경 없이 전체를 채우는 불투명 단색입니다(둥근 모서리는 시스템이 처리).
  - PNG 로 내보낼 때 알파 채널을 반드시 끄세요(불투명 배경 유지).
  변환/연결 절차: docs/app-assets.md 참조.
  모티프: 걷는 보행자 + 위험구역 경고 링.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 불투명 배경(알파 없음). 둥근 모서리 미적용 — 시스템이 마스킹. -->
  <rect x="0" y="0" width="1024" height="1024" fill="#1a7f37"/>

  <!-- 경고 링 (위험구역 경고 상징) — 점선 원 -->
  <circle cx="512" cy="512" r="392" fill="none" stroke="#ffd21f" stroke-width="34"
          stroke-linecap="round" stroke-dasharray="70 46"/>

  <!-- 보행자 심볼 (걷는 사람) -->
  <g fill="#ffffff">
    <!-- 머리 -->
    <circle cx="470" cy="300" r="66"/>
    <!-- 몸통 -->
    <path d="M452 372
             L512 388
             L556 470
             L520 500
             L486 452
             L486 560
             L452 560
             Z"/>
    <!-- 앞으로 뻗은 팔 -->
    <path d="M512 402 L620 430 L612 468 L500 448 Z"/>
    <!-- 앞다리(내딛는 다리) -->
    <path d="M486 548 L540 560 L600 720 L556 742 L500 604 Z"/>
    <!-- 뒷다리(밀어내는 다리) -->
    <path d="M452 548 L488 560 L430 726 L384 712 L432 596 Z"/>
  </g>
</svg>
