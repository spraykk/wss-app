<?xml version="1.0" encoding="UTF-8"?>
<!--
  발자국 아이콘 — 파스텔 스카이블루 배경 + 흰색 발자국(걷는 방향 한 쌍)
  앱 아이콘 (보행 개선 / WSS) — 1024x1024
  - 불투명 배경(알파 없음 — App Store 요구). 배경색 #BFE3F5 (파스텔 스카이블루).
  - 둥근 모서리 미적용(시스템이 마스킹). 앱 이름 텍스트 없음(스플래시에만 포함).
  - PNG 내보낼 때 알파 채널을 반드시 끄세요(배경 불투명 #BFE3F5).
  모티프: 걷는 방향으로 놓인 흰색 발자국 두 개(왼발/오른발) = "보행".
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 불투명 파스텔 스카이블루 배경 -->
  <rect x="0" y="0" width="1024" height="1024" fill="#BFE3F5"/>

  <!-- 왼발 (아래·왼쪽, 살짝 회전) -->
  <g fill="#FFFFFF" transform="translate(392 620) rotate(-12)">
    <!-- 발바닥(뒤꿈치~볼) -->
    <ellipse cx="0" cy="0" rx="86" ry="132"/>
    <!-- 발가락 -->
    <ellipse cx="-40" cy="-168" rx="30" ry="34"/>
    <ellipse cx="6" cy="-182" rx="24" ry="28"/>
    <ellipse cx="46" cy="-176" rx="20" ry="24"/>
    <ellipse cx="78" cy="-158" rx="16" ry="20"/>
    <ellipse cx="104" cy="-132" rx="13" ry="17"/>
  </g>

  <!-- 오른발 (위·오른쪽, 걷는 방향으로 앞선 발) -->
  <g fill="#FFFFFF" transform="translate(632 404) rotate(12)">
    <ellipse cx="0" cy="0" rx="86" ry="132"/>
    <ellipse cx="40" cy="-168" rx="30" ry="34"/>
    <ellipse cx="-6" cy="-182" rx="24" ry="28"/>
    <ellipse cx="-46" cy="-176" rx="20" ry="24"/>
    <ellipse cx="-78" cy="-158" rx="16" ry="20"/>
    <ellipse cx="-104" cy="-132" rx="13" ry="17"/>
  </g>
</svg>
