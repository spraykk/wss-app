<?xml version="1.0" encoding="UTF-8"?>
<!--
  스플래시 — 아이콘과 동일 톤(파스텔 스카이블루 #BFE3F5 배경 + 흰색 발자국) + 앱 이름.
  보행 개선 / WSS — 세로형 1242x2688 권장.
  - 불투명 배경(알파 없음). app.json backgroundColor 는 #BFE3F5 로 맞추세요.
  - PNG 내보낼 때 알파 끄기. 절차: assets/ICON_CANDIDATES.md / docs/app-assets.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="2688" viewBox="0 0 1242 2688">
  <!-- 불투명 파스텔 스카이블루 배경 -->
  <rect x="0" y="0" width="1242" height="2688" fill="#BFE3F5"/>

  <!-- 중앙 로고 마크 (흰색 발자국 한 쌍, 걷는 방향) -->
  <g transform="translate(621 1200)">
    <!-- 왼발 -->
    <g fill="#FFFFFF" transform="translate(-120 216) rotate(-12)">
      <ellipse cx="0" cy="0" rx="86" ry="132"/>
      <ellipse cx="-40" cy="-168" rx="30" ry="34"/>
      <ellipse cx="6" cy="-182" rx="24" ry="28"/>
      <ellipse cx="46" cy="-176" rx="20" ry="24"/>
      <ellipse cx="78" cy="-158" rx="16" ry="20"/>
      <ellipse cx="104" cy="-132" rx="13" ry="17"/>
    </g>
    <!-- 오른발 (앞선 발) -->
    <g fill="#FFFFFF" transform="translate(120 0) rotate(12)">
      <ellipse cx="0" cy="0" rx="86" ry="132"/>
      <ellipse cx="40" cy="-168" rx="30" ry="34"/>
      <ellipse cx="-6" cy="-182" rx="24" ry="28"/>
      <ellipse cx="-46" cy="-176" rx="20" ry="24"/>
      <ellipse cx="-78" cy="-158" rx="16" ry="20"/>
      <ellipse cx="-104" cy="-132" rx="13" ry="17"/>
    </g>
  </g>

  <!-- 앱 이름 -->
  <text x="621" y="1720" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="96" font-weight="800" fill="#FFFFFF">보행 개선</text>
</svg>
