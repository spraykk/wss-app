<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>보행 개선 — 테스터 피드백 증빙 대시보드</title>
  <meta name="description" content="테스터에게 직접 받은 피드백을 서버 원본 그대로 보여주는 증빙용 대시보드." />
  <!--
    ============================================================================
    설정 방법 (배포 전에 아래 두 값을 채우세요)
    ============================================================================
    이 대시보드는 Supabase 의 공개(anon / publishable) 키로 list_feedback() 과
    get_feedback_summary() RPC 만 호출합니다. anon 키는 공개해도 되는 키이지만,
    소스 저장소에 커밋하지 않기 위해 아래 상수는 비워 두었습니다.
    배포(또는 로컬 확인) 시점에 본인 프로젝트 값으로 직접 채워 넣으세요.

      - SUPABASE_URL : Supabase 프로젝트 URL (예: https://xxxx.supabase.co)
      - SUPABASE_ANON_KEY : anon(public/publishable) 키. service_role/secret 키는
                            절대 넣지 마세요(원시 데이터 노출 위험).

    주의:
      - 이 페이지는 서버가 계산·가공한 값(list_feedback / get_feedback_summary)만
        읽습니다. device_id 원본은 서버 RPC 가 익명 참조코드로 대체해 내보냅니다.
      - 표시되는 날짜는 모두 서버가 기록한 원본 타임스탬프(created_at)입니다.
        임의로 편집·정렬 조작을 하지 않고 수집된 그대로 보여줍니다.
    ============================================================================
  -->
  <style>
    :root {
      --bg: #F4FAFE; --surface: #FFFFFF; --surface-alt: #EAF6FD;
      --sky: #BFE3F5; --sky-deep: #7FC4E8; --sky-deepest: #4A93BE;
      --pink: #FBD5E3; --pink-deep: #F19BB8;
      --yellow: #FCEFC2; --yellow-deep: #C79A2E;
      --mint: #DFF3E4; --mint-text: #1F7A43;
      --rose: #FBD9DE; --rose-text: #B32B3C;
      --text: #1F2D3A; --muted: #5A6B7B; --faint: #8A9AA8; --border: #DCE9F2;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", Roboto, sans-serif;
      max-width: 960px; margin: 0 auto; padding: 24px; line-height: 1.6;
      color: var(--text); background: var(--bg);
    }
    header h1 { font-size: 1.5rem; margin: 0 0 4px; }
    header p { color: var(--muted); margin: 0; font-size: 0.92rem; }
    .trust {
      margin-top: 12px; padding: 10px 14px; background: var(--surface-alt);
      border-radius: 12px; color: var(--muted); font-size: 0.85rem;
    }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
    .stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; box-shadow: 0 4px 12px rgba(31,45,58,.06);
    }
    .stat .label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    .stat .value { font-size: 1.8rem; font-weight: 800; color: var(--sky-deepest); margin-top: 4px; }
    .stat .sub { font-size: 0.78rem; color: var(--faint); margin-top: 2px; }
    .dist { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .filter-btn {
      border: 1px solid var(--border); background: var(--surface-alt); color: var(--muted);
      border-radius: 999px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    .filter-btn.active { background: var(--sky-deep); border-color: var(--sky-deep); color: #fff; }
    .list { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; box-shadow: 0 4px 12px rgba(31,45,58,.06);
    }
    .card-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .badge { font-size: 0.78rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
    .badge.bug { background: var(--rose); color: var(--rose-text); }
    .badge.suggestion { background: var(--sky); color: var(--sky-deepest); }
    .badge.praise { background: var(--pink); color: var(--pink-deep); }
    .badge.etc { background: var(--surface-alt); color: var(--muted); }
    .stars { color: var(--yellow-deep); font-size: 0.95rem; letter-spacing: 1px; }
    .anon-ref {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem;
      color: var(--faint); background: var(--surface-alt); padding: 2px 8px; border-radius: 6px;
    }
    .date { color: var(--faint); font-size: 0.8rem; margin-left: auto; }
    .msg { margin-top: 10px; white-space: pre-wrap; color: var(--text); font-size: 0.95rem; }
    .empty, .error {
      padding: 24px; text-align: center; border-radius: 16px; background: var(--surface);
      border: 1px solid var(--border); color: var(--muted);
    }
    .error { background: var(--rose); color: var(--rose-text); }
    footer { margin-top: 28px; color: var(--faint); font-size: 0.78rem; text-align: center; }
    @media print {
      body { background: #fff; }
      .filters { display: none; }
      .card, .stat { box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header>
    <h1>테스터 피드백 증빙 대시보드</h1>
    <p>「보행 개선」 앱 테스터에게 앱 내 '의견 보내기'로 직접 받은 피드백입니다.</p>
    <div class="trust">
      이 페이지는 Supabase 서버가 기록한 원본 데이터를 조작 없이 그대로 표시합니다.
      각 항목의 날짜는 서버가 남긴 <strong>원본 타임스탬프(created_at)</strong>이며,
      작성자는 개인정보 보호를 위해 <strong>익명 참조코드</strong>로만 표시됩니다.
      (샘플·가짜 데이터는 포함하지 않으며, 실제 수집분만 보여줍니다.)
    </div>
  </header>

  <section id="summary" class="summary" aria-label="요약 통계"></section>

  <div id="filters" class="filters" aria-label="카테고리 필터"></div>

  <section id="list" class="list" aria-live="polite"></section>

  <footer>
    <span id="generated"></span> · 서버 원본 기준 · 조작 없이 수집분 그대로 표시
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // ==== 배포 시 채워 넣을 값 (anon/public 키만! 커밋 금지) =====================
    const SUPABASE_URL = "";        // 예: "https://xxxx.supabase.co"
    const SUPABASE_ANON_KEY = "";   // anon(public) 키. service_role 금지.
    // ============================================================================

    const CATEGORY_LABELS = { bug: "버그", suggestion: "제안", praise: "칭찬", etc: "기타" };
    let allRows = [];
    let activeFilter = "all";

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }
    function stars(rating) {
      if (rating == null) return '<span class="stars" title="별점 미입력">☆☆☆☆☆</span>';
      const n = Math.max(0, Math.min(5, Number(rating) | 0));
      return `<span class="stars" title="${n}점">${"★".repeat(n)}${"☆".repeat(5 - n)}</span>`;
    }
    function fmtDate(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return esc(iso);
      const p = (x) => String(x).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function renderSummary(s) {
      const el = document.getElementById("summary");
      if (!s) { el.innerHTML = ""; return; }
      const avg = s.average_rating == null ? "—" : Number(s.average_rating).toFixed(2);
      el.innerHTML = `
        <div class="stat"><div class="label">총 피드백</div><div class="value">${s.total_count ?? 0}건</div></div>
        <div class="stat"><div class="label">참여 기기</div><div class="value">${s.device_count ?? 0}명</div><div class="sub">중복 제거 익명 기기수</div></div>
        <div class="stat"><div class="label">평균 별점</div><div class="value">${avg}</div><div class="sub">별점을 남긴 항목 기준</div></div>
        <div class="stat">
          <div class="label">카테고리 분포</div>
          <div class="dist">
            <span class="badge bug">버그 ${s.bug_count ?? 0}</span>
            <span class="badge suggestion">제안 ${s.suggestion_count ?? 0}</span>
            <span class="badge praise">칭찬 ${s.praise_count ?? 0}</span>
            <span class="badge etc">기타 ${s.etc_count ?? 0}</span>
          </div>
        </div>`;
    }

    function renderFilters() {
      const cats = ["all", "bug", "suggestion", "praise", "etc"];
      const label = (c) => (c === "all" ? "전체" : CATEGORY_LABELS[c]);
      document.getElementById("filters").innerHTML = cats
        .map((c) => `<button class="filter-btn ${c === activeFilter ? "active" : ""}" data-cat="${c}">${label(c)}</button>`)
        .join("");
      document.querySelectorAll(".filter-btn").forEach((b) =>
        b.addEventListener("click", () => { activeFilter = b.dataset.cat; renderFilters(); renderList(); })
      );
    }

    function renderList() {
      const el = document.getElementById("list");
      const rows = activeFilter === "all" ? allRows : allRows.filter((r) => r.category === activeFilter);
      if (rows.length === 0) {
        el.innerHTML = `<div class="empty">표시할 피드백이 아직 없습니다.</div>`;
        return;
      }
      el.innerHTML = rows.map((r) => {
        const cat = CATEGORY_LABELS[r.category] || esc(r.category);
        const ver = r.app_version ? `· v${esc(r.app_version)}` : "";
        return `
          <article class="card">
            <div class="card-top">
              <span class="badge ${esc(r.category)}">${esc(cat)}</span>
              ${stars(r.rating)}
              <span class="anon-ref">#${esc(r.anon_ref)}</span>
              <span class="date">${fmtDate(r.created_at)} ${ver}</span>
            </div>
            <div class="msg">${esc(r.message)}</div>
          </article>`;
      }).join("");
    }

    function showError(msg) {
      document.getElementById("list").innerHTML = `<div class="error">${esc(msg)}</div>`;
    }

    async function load() {
      document.getElementById("generated").textContent = "조회 시각 " + fmtDate(new Date().toISOString());
      renderFilters();
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        showError("Supabase URL / anon 키가 설정되지 않았습니다. feedback.html 상단 주석의 안내를 참고해 SUPABASE_URL 과 SUPABASE_ANON_KEY 를 채운 뒤 다시 여세요.");
        return;
      }
      try {
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { persistSession: false, autoRefreshToken: false },
        });
        const [listRes, sumRes] = await Promise.all([
          client.rpc("list_feedback"),
          client.rpc("get_feedback_summary"),
        ]);
        if (listRes.error) { showError("피드백 목록 조회 실패: " + listRes.error.message); return; }
        allRows = Array.isArray(listRes.data) ? listRes.data : [];
        const summary = Array.isArray(sumRes.data) ? sumRes.data[0] : sumRes.data;
        renderSummary(sumRes.error ? null : summary);
        renderList();
      } catch (e) {
        showError("불러오는 중 오류가 발생했습니다: " + (e && e.message ? e.message : String(e)));
      }
    }

    load();
  </script>
</body>
</html>
